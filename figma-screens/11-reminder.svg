<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect x="0" y="0" width="390" height="844" rx="28" fill="#faf6ed" stroke="none"/><text x="26" y="29" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="11" font-weight="600" fill="#402c22">9:41</text><rect x="150" y="9" width="90" height="22" rx="13" fill="#402c22" stroke="none"/><text x="26" y="77" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#402c22">‹</text><text x="302" y="77" font-family="Fraunces, Arial, sans-serif" font-size="18" font-weight="400" fill="#402c22">acorn</text><text x="24" y="126" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="10" font-weight="600" fill="#45634b">A LITTLE CARE, EVERY DAY</text><text x="24" y="171" font-family="Fraunces, Arial, sans-serif" font-size="31" font-weight="400" fill="#402c22">Choose a reminder.</text><text x="24" y="204" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#74685b">Your preference, clearly labeled.</text><text x="24" y="246" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">No clock time was written. Choose when</text><text x="24" y="268" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">you want a reminder.</text><rect x="24" y="316" width="342" height="113" rx="14" fill="#fffcf5" stroke="#e3dacb"/><text x="40" y="346" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="10" font-weight="400" fill="#74685b">CURRENT DIRECTIONS</text><text x="40" y="376" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#402c22">Take ONE tablet by mouth once</text><text x="40" y="398" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#402c22">daily.</text><text x="24" y="475" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="600" fill="#402c22">Your reminder preference</text><rect x="24" y="490" width="342" height="64" rx="11" fill="#fffcf5" stroke="#e3dacb"/><text x="42" y="530" font-family="Fraunces, Arial, sans-serif" font-size="25" font-weight="400" fill="#402c22">— — : — —</text><text x="24" y="590" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">Confirm that this matches your current</text><text x="24" y="612" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">prescription before saving.</text><text x="24" y="679" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#74685b">Prototype only: device notifications are not</text><text x="24" y="701" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="12" font-weight="400" fill="#74685b">enabled.</text><rect x="24" y="765" width="342" height="52" rx="13" fill="#402c22" stroke="none"/><text x="42" y="797" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#faf6ed">Confirm my schedule</text></svg>