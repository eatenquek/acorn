y="Plus Jakarta Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#402c22">at 08:00 every day.</text><text x="24" y="590" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">Keep the label flat and well lit. All</text><text x="24" y="612" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#74685b">extracted details need your review.</text><rect x="24" y="701" width="342" height="52" rx="13" fill="#402c22" stroke="none"/><text x="42" y="733" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#faf6ed">Choose a label photo</text><rect x="24" y="765" width="342" height="52" rx="13" fill="#faf6ed" stroke="#e3dacb"/><text x="42" y="797" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="14" font-weight="600" fill="#402c22">Try the sample label</text></svg>